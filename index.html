<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>Studio Peninjauan Kode</title>

  <style>
    :root {
      --bg: #080b12;
      --panel: #10151f;
      --panel2: #151c28;
      --border: #263246;
      --text: #edf3ff;
      --muted: #8c9ab0;
      --primary: #6d7cff;
      --purple: #8b5cf6;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --cyan: #22d3ee;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    button, select, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .btn {
      flex-shrink: 0;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #202b3d;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--purple));
      border-color: transparent;
    }

    .btn.success {
      background: #12351f;
      border-color: #1d6b37;
      color: #71f19a;
    }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 18px;
      background: #0d121b;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--purple));
    }

    .brand-title {
      font-weight: 800;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      overflow-x: auto;
      padding: 3px 0;
      scrollbar-width: thin;
    }

    .toolbar {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      background: #0b1018;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-right: 10px;
      margin-right: 5px;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }

    select {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 46%) minmax(0, 54%);
      height: 650px;
      min-height: 500px;
      min-width: 0;
    }

    .editor-area {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--panel);
    }

    .tabs {
      min-height: 42px;
      display: flex;
      overflow-x: auto;
      background: #0d131d;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab {
      min-height: 42px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }

    .tab.active {
      color: #fff;
      background: var(--panel);
      box-shadow: inset 0 -2px var(--primary);
    }

    .editor-wrap {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      overflow: hidden;
    }

    .line-numbers {
      width: 45px;
      flex-shrink: 0;
      background: #0b1018;
      color: #536078;
      padding: 15px 7px;
      text-align: right;
      font: 13px/1.7 Consolas, monospace;
      user-select: none;
      overflow: hidden;
    }

    .editor {
      flex: 1;
      width: 0;
      min-width: 0;
      height: 100%;
      resize: none;
      border: 0;
      outline: none;
      padding: 15px;
      background: #090e16;
      color: #dbe7ff;
      font: 13px/1.7 Consolas, Monaco, monospace;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .editor-bottom {
      min-height: 34px;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      background: #0d131d;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .preview-area {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #171b22;
    }

    .preview-top {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      background: #0d131d;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .preview-title {
      font-size: 13px;
      font-weight: 700;
    }

    .preview-actions {
      display: flex;
      gap: 5px;
    }

    .preview-actions .btn {
      padding: 7px 9px;
      font-size: 11px;
    }

    .preview-container {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      overflow: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .preview-frame {
      display: block;
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      min-height: 350px;
      border: 1px solid #303846;
      background: #fff;
      border-radius: 5px;
    }

    .preview-frame.mobile {
      width: 390px;
    }

    .preview-frame.tablet {
      width: 768px;
    }

    .preview-frame.desktop {
      width: 100%;
    }

    .statusbar {
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 12px;
      background: #0d121b;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .bottom-panel {
      display: none;
      background: #0c111a;
      border-top: 1px solid var(--border);
    }

    .bottom-panel.open {
      display: block;
    }

    .console-header {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
    }

    .console {
      height: 180px;
      overflow: auto;
      padding: 10px;
      font: 12px/1.6 Consolas, monospace;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .log {
      padding: 3px 0;
      overflow-wrap: anywhere;
    }

    .log.info { color: #9cb4d9; }
    .log.success { color: #67e8a0; }
    .log.error { color: #ff7c7c; }
    .log.warning { color: #f7c96c; }

    .review-panel {
      position: fixed;
      right: 0;
      top: 0;
      width: min(380px, 100%);
      height: 100vh;
      height: 100dvh;
      background: #0e141e;
      border-left: 1px solid var(--border);
      transform: translateX(105%);
      transition: transform 0.25s ease;
      z-index: 50;
      overflow-y: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .review-panel.open {
      transform: translateX(0);
    }

    .review-header {
      position: sticky;
      top: 0;
      background: #0e141e;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      z-index: 2;
    }

    .review-content {
      padding: 15px;
    }

    .score {
      width: 110px;
      height: 110px;
      margin: 5px auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 900;
      background: conic-gradient(var(--green) var(--score, 0%), #263246 0);
      position: relative;
    }

    .score::after {
      content: "";
      position: absolute;
      inset: 9px;
      background: #0e141e;
      border-radius: 50%;
    }

    .score span {
      position: relative;
      z-index: 1;
    }

    .issue {
      padding: 12px;
      margin-bottom: 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #121a26;
    }

    .issue.error { border-left: 3px solid var(--red); }
    .issue.warning { border-left: 3px solid var(--yellow); }
    .issue.info { border-left: 3px solid var(--cyan); }

    .issue-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .issue-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
      }

      .top-actions {
        width: 100%;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 0;
      }

      .editor-area {
        height: 70vh;
        height: 70dvh;
        min-height: 400px;
        flex: none;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .preview-area {
        min-height: 300px;
      }
    }

    @media (max-width: 380px) {
      .brand-sub {
        font-size: 10px;
      }

      .tab {
        padding: 0 11px;
      }

      .preview-title {
        font-size: 11px;
      }

      .editor-bottom {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">&lt;/&gt;</div>
      <div>
        <div class="brand-title">CodeReview Studio</div>
        <div class="brand-sub">Editor Kode Langsung &amp; Pratinjau Situs Web</div>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn" onclick="newProject()">+ Baru</button>
      <button class="btn" onclick="saveProject()">💾 Simpan</button>
      <button class="btn" onclick="loadProject()">📂 Muat</button>
      <button class="btn" onclick="downloadProject()">⬇ Unduh</button>
      <button class="btn primary" onclick="reviewCode()">🔍 Ulasan</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-group">
      <button class="btn success" onclick="runCode()">▶ Jalankan</button>
      <button class="btn" onclick="toggleAutoRun()">
        <span id="autoText">⚡ Jalankan Otomatis: AKTIF</span>
      </button>
      <button class="btn" onclick="refreshPreview()">↻ Segarkan</button>
    </div>

    <div class="toolbar-group">
      <select id="deviceSelect" onchange="changeDevice()">
        <option value="desktop">🖥 Desktop</option>
        <option value="tablet">📱 Tablet</option>
        <option value="mobile">📱 Ponsel</option>
      </select>
    </div>

    <div class="toolbar-group">
      <select id="fontSize" onchange="changeFontSize()">
        <option value="11">Font 11</option>
        <option value="12">Font 12</option>
        <option value="13" selected>Font 13</option>
        <option value="14">Font 14</option>
        <option value="15">Font 15</option>
        <option value="16">Font 16</option>
      </select>
    </div>

    <div class="toolbar-group">
      <button class="btn" onclick="toggleConsole()">🖥 Konsol</button>
      <button class="btn" onclick="openFullscreen()">⛶ Layar Penuh</button>
    </div>
  </div>

  <main class="workspace">
    <section class="editor-area">
      <div class="tabs">
        <div class="tab active" id="tab-html" onclick="switchTab('html')">🌐 HTML</div>
        <div class="tab" id="tab-css" onclick="switchTab('css')">🎨 CSS</div>
        <div class="tab" id="tab-js" onclick="switchTab('js')">⚡ JavaScript</div>
      </div>

      <div class="editor-wrap">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea
          id="editor"
          class="editor"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          aria-label="Kode editor"
          oninput="editorChanged()"
          onscroll="syncScroll()"
          onkeydown="handleEditorKey(event)"
        ></textarea>
      </div>

      <div class="editor-bottom">
        <span id="languageStatus">HTML</span>
        <span id="editorStats">0 baris · 0 karakter</span>
      </div>
    </section>

    <section class="preview-area">
      <div class="preview-top">
        <div class="preview-title">🌎 Pratinjau Situs Web Langsung</div>
        <div class="preview-actions">
          <button class="btn" onclick="openPreviewNewTab()">↗ Buka</button>
          <button class="btn" onclick="clearPreview()">🗑 Hapus</button>
        </div>
      </div>

      <div class="preview-container" id="previewContainer">
        <iframe id="preview" class="preview-frame desktop" title="Pratinjau situs web" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
      </div>
    </section>
  </main>

  <div class="statusbar">
    <span id="statusMessage">CodeReview Studio siap digunakan.</span>
    <span>Gulir halaman: aktif</span>
  </div>

  <section class="bottom-panel" id="consolePanel">
    <div class="console-header">
      <strong>🖥 Konsol</strong>
      <button class="btn" onclick="clearConsole()">Hapus</button>
    </div>
    <div class="console" id="consoleOutput"></div>
  </section>

  <aside class="review-panel" id="reviewPanel">
    <div class="review-header">
      <strong>🔍 Tinjauan Kode</strong>
      <button class="btn" onclick="toggleReview()">✕ Tutup</button>
    </div>
    <div class="review-content" id="reviewContent"></div>
  </aside>

  <script>
    "use strict";

    const project = {
      html: `<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Situs Web Saya</title>
</head>
<body>
  <header class="hero">
    <h1>Halo Dunia 👋</h1>
    <p>Ini situs web yang dibuat dengan CodeReview Studio.</p>
    <button onclick="hello()">Klik Saya</button>
  </header>

  <main>
    <section class="card">
      <h2>Pratinjau Langsung</h2>
      <p>Edit HTML, CSS, dan JavaScript untuk mengubah situs web ini.</p>
    </section>
  </main>
</body>
</html>`,

      css: `* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111827, #312e81);
  color: white;
}

.hero {
  text-align: center;
  padding: 80px 20px;
}

.hero h1 {
  font-size: clamp(32px, 6vw, 50px);
}

.hero p {
  color: #cbd5e1;
}

button {
  margin-top: 20px;
  padding: 13px 22px;
  border: 0;
  border-radius: 10px;
  background: #6366f1;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

.card {
  background: rgba(255, 255, 255, 0.1);
  padding: 30px;
  border-radius: 20px;
}`,

      js: `function hello() {
  console.log("Tombol berhasil diklik!");
  alert("Halo dari CodeReview Studio!");
}`
    };

    let currentTab = "html";
    let autoRun = true;
    let saveTimer = null;

    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");
    const lineNumbers = document.getElementById("lineNumbers");

    function init() {
      editor.value = project.html;
      updateLineNumbers();
      runCode();
    }

    window.addEventListener("DOMContentLoaded", init);

    function saveCurrentEditor() {
      project[currentTab] = editor.value;
    }

    function switchTab(tab) {
      saveCurrentEditor();
      currentTab = tab;

      document.querySelectorAll(".tab").forEach((element) => {
        element.classList.remove("active");
      });

      document.getElementById("tab-" + tab).classList.add("active");
      editor.value = project[tab];

      const languageLabel = tab === "html" ? "HTML" : tab === "css" ? "CSS" : "JavaScript";
      document.getElementById("languageStatus").textContent = languageLabel;

      editor.scrollTop = 0;
      editor.scrollLeft = 0;
      lineNumbers.scrollTop = 0;

      updateLineNumbers();
      editor.focus();
    }

    function updateStats() {
      const value = editor.value;
      const lines = value.length ? value.split("\n").length : 0;
      document.getElementById("editorStats").textContent = lines + " baris · " + value.length + " karakter";
    }

    function updateLineNumbers() {
      const count = Math.max(1, editor.value.split("\n").length);
      let output = "";

      for (let i = 1; i <= count; i += 1) {
        output += i + "\n";
      }

      lineNumbers.textContent = output;
      updateStats();
      syncScroll();
    }

    function syncScroll() {
      lineNumbers.scrollTop = editor.scrollTop;
    }

    function editorChanged() {
      saveCurrentEditor();
      updateLineNumbers();

      if (autoRun) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(runCode, 500);
      }
    }

    function handleEditorKey(event) {
      if (event.key === "Tab") {
        event.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.setRangeText("  ", start, end, "end");
        editorChanged();
      }

      if (event.ctrlKey && event.key.toLowerCase() === "s") {
        event.preventDefault();
        saveProject();
      }

      if (event.ctrlKey && event.key === "Enter") {
        event.preventDefault();
        runCode();
      }
    }

    function setStatus(message) {
      document.getElementById("statusMessage").textContent = message;
    }

    function extractBody(html) {
      const match = /<body\b[^>]*>([\s\S]*?)<\/body\s*>/i.exec(html);
      return match ? match[1] : html;
    }

    function buildDocument() {
      const bodyContent = extractBody(project.html);
      const safeCss = String(project.css || "").replace(/<\/style>/gi, "<\\/style>");
      const safeJs = String(project.js || "").replace(/<\/script>/gi, "<\\/script>");
      const scriptSource = JSON.stringify(safeJs);

      return `<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview</title>
  <style>${safeCss}</style>
</head>
<body>
  ${bodyContent}
  <script>
    try {
      const scriptFn = new Function(${scriptSource});
      scriptFn();
    } catch (error) {
      window.parent.postMessage({
        type: "crs-console",
        level: "error",
        data: "Preview error: " + error.message
      }, "*");
      console.error(error);
    }
  <\/script>
</body>
</html>`;
    }

    function runCode() {
      saveCurrentEditor();
      try {
        preview.srcdoc = buildDocument();
        setStatus("Preview berhasil diperbarui.");
        logConsole("Preview diperbarui.", "success");
      } catch (error) {
        setStatus("Preview gagal dibuat.");
        logConsole("Preview gagal dibuat: " + error.message, "error");
      }
    }

    function refreshPreview() {
      runCode();
    }

    function clearPreview() {
      preview.srcdoc = "";
      setStatus("Pratinjau dibersihkan.");
      logConsole("Pratinjau dihapus.", "info");
    }

    function openPreviewNewTab() {
      const blob = new Blob([buildDocument()], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const newWindow = window.open(url, "_blank");

      if (!newWindow) {
        logConsole("Browser memblokir tab baru. Izinkan pop-up untuk membuka preview.", "warning");
      }

      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    function toggleAutoRun() {
      autoRun = !autoRun;
      document.getElementById("autoText").textContent = autoRun
        ? "⚡ Jalankan Otomatis: AKTIF"
        : "⚡ Jalankan Otomatis: MATI";
      setStatus(autoRun ? "Auto Run diaktifkan." : "Auto Run dinonaktifkan.");
    }

    function changeDevice() {
      const device = document.getElementById("deviceSelect").value;
      preview.className = "preview-frame " + device;
    }

    function changeFontSize() {
      editor.style.fontSize = document.getElementById("fontSize").value + "px";
    }

    function toggleConsole() {
      document.getElementById("consolePanel").classList.toggle("open");
    }

    function clearConsole() {
      document.getElementById("consoleOutput").replaceChildren();
    }

    function logConsole(message, type = "info") {
      const output = document.getElementById("consoleOutput");
      const line = document.createElement("div");
      line.className = "log " + type;
      line.textContent = "[" + new Date().toLocaleTimeString("id-ID") + "] " + message;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    window.addEventListener("message", function (event) {
      if (!event.data || event.data.type !== "crs-console") return;

      const level = event.data.level === "error"
        ? "error"
        : event.data.level === "warning"
          ? "warning"
          : "info";

      logConsole(event.data.data, level);
    });

    function reviewCode() {
      saveCurrentEditor();

      const issues = [];
      let score = 100;
      const allCode = project.html + "\n" + project.css + "\n" + project.js;

      if (!project.html.trim()) {
        issues.push({
          type: "error",
          title: "HTML kosong",
          text: "Tambahkan kode HTML terlebih dahulu."
        });
        score -= 30;
      }

      if (project.html.trim() && !/<html\b/i.test(project.html)) {
        issues.push({
          type: "info",
          title: "Tag HTML utama tidak ditemukan",
          text: "Pertimbangkan menggunakan struktur HTML lengkap."
        });
        score -= 3;
      }

      if (/<img\b/i.test(project.html) && !/<img\b[^>]*\balt\s*=/i.test(project.html)) {
        issues.push({
          type: "warning",
          title: "Gambar tanpa ALT",
          text: "Tambahkan atribut alt untuk aksesibilitas gambar."
        });
        score -= 5;
      }

      if (/!important/.test(project.css)) {
        issues.push({
          type: "info",
          title: "Penggunaan !important",
          text: "Pastikan !important memang diperlukan."
        });
        score -= 2;
      }

      if (/\beval\s*\(/.test(project.js)) {
        issues.push({
          type: "error",
          title: "Penggunaan eval()",
          text: "eval() dapat menimbulkan risiko keamanan."
        });
        score -= 20;
      }

      if (/\b(password|api[_-]?key|secret|token)\s*[:=]\s*["'][^"']+["']/i.test(allCode)) {
        issues.push({
          type: "error",
          title: "Kemungkinan rahasia di frontend",
          text: "Jangan masukkan kata sandi, kunci API, atau token rahasia di kode publik."
        });
        score -= 25;
      }

      if (/console\.log\s*\(/.test(project.js)) {
        issues.push({
          type: "info",
          title: "console.log ditemukan",
          text: "Hapus log debugging yang tidak diperlukan sebelum penerapan."
        });
        score -= 1;
      }

      if (issues.length === 0) {
        issues.push({
          type: "info",
          title: "Pemeriksaan dasar selesai",
          text: "Tidak ditemukan pola masalah dari aturan sederhana ini. Tetap uji situs web sebelum digunakan."
        });
      }

      score = Math.max(0, Math.min(100, score));
      renderReview(issues, score);
    }

    function renderReview(issues, score) {
      const panel = document.getElementById("reviewPanel");
      const content = document.getElementById("reviewContent");

      panel.classList.add("open");
      content.replaceChildren();

      const scoreBox = document.createElement("div");
      scoreBox.className = "score";
      scoreBox.style.setProperty("--score", score + "%");

      const scoreNumber = document.createElement("span");
      scoreNumber.textContent = score;
      scoreBox.appendChild(scoreNumber);
      content.appendChild(scoreBox);

      const summary = document.createElement("p");
      summary.style.textAlign = "center";
      summary.style.color = "var(--muted)";
      summary.textContent = issues.length + " catatan ditemukan";
      content.appendChild(summary);

      issues.forEach((issue) => {
        const box = document.createElement("div");
        box.className = "issue " + issue.type;

        const title = document.createElement("div");
        title.className = "issue-title";
        title.textContent = (issue.type === "error" ? "🔴 " : issue.type === "warning" ? "🟡 " : "🔵 ") + issue.title;

        const text = document.createElement("div");
        text.className = "issue-text";
        text.textContent = issue.text;

        box.append(title, text);
        content.appendChild(box);
      });

      const note = document.createElement("p");
      note.className = "issue-text";
      note.textContent = "Pemeriksaan ini berdasarkan aturan sederhana, bukan pengganti linter atau pemindai keamanan profesional.";
      content.appendChild(note);
    }

    function toggleReview() {
      document.getElementById("reviewPanel").classList.toggle("open");
    }

    function newProject() {
      if (!confirm("Buat project baru? Kode saat ini akan diganti.")) {
        return;
      }

      project.html = `<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyek Baru</title>
</head>
<body>
  <h1>Halo Dunia</h1>
  <p>Proyek baru dimulai!</p>
</body>
</html>`;

      project.css = `body {
  font-family: Arial, sans-serif;
  padding: 40px;
}`;

      project.js = `console.log("Project baru siap");`;

      switchTab("html");
      runCode();
    }

    function saveProject() {
      saveCurrentEditor();

      try {
        localStorage.setItem("CodeReviewStudioProject", JSON.stringify(project));
        setStatus("Proyek disimpan di penyimpanan browser.");
        logConsole("Proyek berhasil disimpan.", "success");
      } catch (error) {
        setStatus("Proyek gagal disimpan.");
        logConsole("Penyimpanan gagal: " + error.message, "error");
        alert("Penyimpanan gagal. Periksa ruang penyimpanan browser.");
      }
    }

    function loadProject() {
      try {
        const data = localStorage.getItem("CodeReviewStudioProject");

        if (!data) {
          alert("Belum ada proyek yang tersimpan di browser ini.");
          return;
        }

        const saved = JSON.parse(data);

        project.html = typeof saved.html === "string" ? saved.html : "";
        project.css = typeof saved.css === "string" ? saved.css : "";
        project.js = typeof saved.js === "string" ? saved.js : "";

        switchTab("html");
        runCode();

        setStatus("Proyek berhasil dimuat.");
        logConsole("Proyek berhasil dimuat.", "success");
      } catch (error) {
        alert("Proyek tidak bisa dimuat karena datanya bermasalah.");
      }
    }

    function downloadProject() {
      saveCurrentEditor();

      const blob = new Blob([buildDocument()], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = "situs-codereview.html";

      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setStatus("File HTML disiapkan untuk disimpan.");
    }

    function openFullscreen() {
      const container = document.getElementById("previewContainer");

      if (container.requestFullscreen) {
        container.requestFullscreen().catch(() => {
          logConsole("Layar penuh tidak tersedia di browser ini.", "warning");
        });
      } else {
        logConsole("Browser tidak mendukung layar penuh.", "warning");
      }
    }

    document.addEventListener("keydown", function (event) {
      if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === "r") {
        event.preventDefault();
        runCode();
      }

      if (event.key === "Escape") {
        document.getElementById("reviewPanel").classList.remove("open");
      }
    });
  </script>
</body>
</html>
